<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财经新闻 · 五大赛道 · AI 局面分析</title>
  <style>
    :root {
      --bg: #0f1214;
      --panel: #161a1d;
      --panel-2: #1d2226;
      --border: #262b30;
      --text: #e6e6e6;
      --muted: #8a8f95;
      --primary: #4a9eff;
      --primary-bg: rgba(74,158,255,.12);
      --accent: #ff9a3c;
      --ok: #31d0aa;
      --danger: #ff6b6b;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0a0d0f 0%, #0f1214 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    header.hero {
      padding: 32px;
      background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .hero .meta {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .hero .meta b {
      color: var(--text);
      font-weight: 500;
    }

    .section-title {
      margin: 48px 0 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* AI 局面分析
    --------------------------------------------------------- */
    .situation {
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .situation h3 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--primary);
    }

    .situation p {
      margin: 0 0 16px;
      color: var(--text);
    }

    .situation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .situation-card {
      padding: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .situation-card h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--accent);
    }

    .situation-card p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .actions-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
    }

    .actions-list li { margin: 4px 0; }

    @media (max-width: 800px) {
      .situation-grid { grid-template-columns: 1fr; }
    }

    /* 赛道汇总
    --------------------------------------------------------- */
    .sectors-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .sector-summary {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .sector-summary h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .sector-summary .count {
      font-size: 28px;
      font-weight: 600;
      color: var(--primary);
    }

    .sector-summary .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .sector-summary .chips {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-block;
      padding: 3px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      font-size: 12px;
    }

    /* 新闻卡片
    --------------------------------------------------------- */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .card h4 {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
    }

    .card a {
      color: var(--text);
      text-decoration: none;
    }

    .card .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px 0;
    }

    .card .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--primary-bg);
      color: var(--primary);
      border: 1px solid transparent;
    }

    .card .pill.topic {
      background: rgba(255,154,60,.12);
      color: var(--accent);
    }

    .card .reason {
      margin: 10px 0 0;
      padding: 12px;
      background: var(--panel-2);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    /* 状态提示
    --------------------------------------------------------- */
    .status {
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>财经新闻 · 五大赛道 · AI 局面分析</h1>
      <p>保险 / 银行 / 非银金融 / 信贷 / 财富管理：每日抓取 + AI 整体局面分析。</p>
      <div class="meta" id="hero-meta">数据更新中…</div>
    </header>

    <!-- 加载状态 -->
    <div class="status" id="status">正在抓取数据中…</div>

    <!-- AI 整体局面分析 -->
    <div class="hidden" id="situation-block">
      <div class="section-title">AI 整体局面分析</div>
      <div class="situation" id="situation"></div>
    </div>

    <!-- 五大赛道汇总 -->
    <div class="hidden" id="summary-block">
      <div class="section-title">五大赛道今日汇总</div>
      <div class="sectors-summary" id="sectors-summary"></div>
    </div>

    <!-- 各赛道新闻 -->
    <div id="sector-blocks"></div>
  </div>

  <script>
    const JSON_URL = "https://katherynsun21-sketch.github.io/financial/data/latest.json";

    function renderHero(meta) {
      const el = document.getElementById("hero-meta");
      if (!el) return;
      const date = meta.date || "";
      const time = meta.time || "";
      const total = meta.total_items || 0;
      const srcCount = meta.sources_count || "-";
      el.innerHTML =
        "更新时间：" + (date + " " + time) +
        "　｜　共抓取 <b>" + total + "</b> 条新闻" +
        "　｜　来源数量 <b>" + srcCount + "</b>";
    }

    function renderSituation(data) {
      const block = document.getElementById("situation-block");
      const el = document.getElementById("situation");
      const sit = data.situation_analysis || {};

      block.classList.remove("hidden");

      const overall = sit.overall || sit.overall_situation || "暂无 AI 局面分析待生成。";
      const themes = Array.isArray(sit.core_themes) && sit.core_themes.length
        ? sit.core_themes.slice(0, 6)
        : [];
      const sectorView = sit.sector_views || {};
      const actions = Array.isArray(sit.today_actions) ? sit.today_actions : [];
      const gen = sit.generated_by || "keyword_fallback";

      el.innerHTML = "";

      const h3 = document.createElement("h3");
      h3.textContent = "整体局面总览（" + gen + ")";
      el.appendChild(h3);

      const p = document.createElement("p");
      p.textContent = overall;
      el.appendChild(p);

      if (themes.length) {
        const themesBlock = document.createElement("div");
        themesBlock.className = "situation-grid";
        themesBlock.innerHTML =
          '<div class="situation-card"><h4>核心主题</h4>' +
          '<div>' +
          themes.map(function (t) { return '<div style="margin:6px 0; font-size:14px;">· ' + t + '</div>'; }).join("") +
          '</div></div>';
        el.appendChild(themesBlock);
      }

      const viewsBlock = document.createElement("div");
      viewsBlock.className = "situation-grid";
      viewsBlock.innerHTML =
        ["保险", "银行", "非金", "信贷", "财富"].map(function (sector) {
          const view = sectorView[sector] || {};
          return '<div class="situation-card"><h4>' + sector + '赛道观察</h4>' +
            '<p>' + (view.observation || view.insight || "暂无观察点") + '</p>' +
            '</div>';
        }).join("");
      el.appendChild(viewsBlock);

      if (actions.length) {
        const actWrap = document.createElement("div");
        actWrap.className = "situation-grid";
        actWrap.innerHTML =
          '<div class="situation-card"><h4>今日可执行动作</h4>' +
          '<ul class="actions-list">' +
          actions.map(function (a) { return '<li>' + a + '</li>'; }).join("") +
          '</ul></div>';
        el.appendChild(actWrap);
      }
    }

    function renderSummary(data) {
      const block = document.getElementById("summary-block");
      const el = document.getElementById("sectors-summary");
      const summary = data.sector_summary || {};

      block.classList.remove("hidden");
      el.innerHTML = "";

      ["保险", "银行", "非金", "信贷", "财富"].forEach(function (sector) {
        const s = summary[sector] || {};
        const count = s.count || 0;
        const coverage = s.coverage || "数据不足";
        const topicCounts = s.topic_counts || {};
        const chipTexts = Object.keys(topicCounts).slice(0, 4);

        const card = document.createElement("div");
        card.className = "sector-summary";
        card.innerHTML =
          '<h3>' + sector + '</h3>' +
          '<div class="count">' + count + '</div>' +
          '<div class="sub">' + coverage + '</div>' +
          '<div class="chips">' +
          chipTexts.map(function (t) { return '<span class="chip">' + t + ' ' + (topicCounts[t] || 0) + '</span>'; }).join("") +
          '</div>';
        el.appendChild(card);
      });
    }

    function renderSectors(data) {
      const container = document.getElementById("sector-blocks");
      const bySector = data.by_sector || {};

      ["保险", "银行", "非金", "信贷", "财富"].forEach(function (sector) {
        const items = bySector[sector] || [];
        if (!items.length) return;

        const wrap = document.createElement("div");
        wrap.innerHTML = '<div class="section-title">' + sector + '（' + items.length + '）</div>';

        const cards = document.createElement("div");
        cards.className = "cards";

        items.slice(0, 15).forEach(function (item) {
          const title = item.title || "";
          const url = item.url || "#";
          const source = item.source || "";
          const topic = item.topic_type || item.event_type || "相关";
          const reason = item.relevance_reason || item.reason || "";
          const sectorAngle = item.sector_angle || "";

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<h4><a href="' + url + '" target="_blank" rel="noopener">' + title + '</a></h4>' +
            '<div class="meta-row">' +
            '<span class="pill">' + sector + '</span>' +
            (topic ? '<span class="pill topic">' + topic + '</span>' : "") +
            (source ? '<span>' + source + '</span>' : "") +
            '</div>' +
            (reason ? '<div class="reason">归类原因：' + reason + '</div>' : "") +
            (sectorAngle ? '<div class="reason">赛道观察：' + sectorAngle + '</div>' : "");

          cards.appendChild(card);
        });

        wrap.appendChild(cards);
        container.appendChild(wrap);
      });
    }

    function showStatus(text, isError) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.classList.toggle("error", !!isError);
    }

    fetch(JSON_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        document.getElementById("status").classList.add("hidden");
        renderHero(data);
        renderSituation(data);
        renderSummary(data);
        renderSectors(data);
      })
      .catch(function (err) {
        showStatus("数据加载失败：" + err.message, true);
      });
  </script>
</body>
</html>
