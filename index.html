<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财经新闻 · 五大赛道 · 每日洞察</title>
  <style>
    :root {
      --bg: #0f1214;
      --panel: #161a1d;
      --panel-2: #1d2226;
      --border: #262b30;
      --text: #e6e6e6;
      --muted: #8a8f95;
      --primary: #4a9eff;
      --primary-bg: rgba(74,158,255,.12);
      --accent: #ff9a3c;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0a0d0f 0%, #0f1214 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    header.hero {
      padding: 32px;
      background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .hero .meta {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .hero .meta b {
      color: var(--text);
      font-weight: 500;
    }

    .section-title {
      margin: 48px 0 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 整体局面
    --------------------------------------------------------- */
    .overall {
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .overall h3 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--primary);
    }

    .overall p {
      margin: 0 0 16px;
    }

    .themes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .themes span {
      padding: 6px 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      color: var(--accent);
    }

    /* 赛道洞察卡片
    --------------------------------------------------------- */
    .sector-insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 800px) {
      .sector-insights { grid-template-columns: 1fr; }
    }

    .sector-card {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .sector-card .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sector-card h3 {
      margin: 0;
      font-size: 17px;
    }

    .sector-card .count {
      color: var(--primary);
      font-size: 13px;
    }

    .sector-card .insight {
      padding: 14px;
      background: var(--panel-2);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
    }

    .sector-card .topics {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sector-card .topics span {
      padding: 3px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }

    /* 新闻列表
    --------------------------------------------------------- */
    .news-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .news-item {
      padding: 14px 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .news-item .title {
      flex: 1;
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
      line-height: 1.6;
    }

    .news-item .title:hover { color: var(--primary); }

    .news-item .tag {
      flex-shrink: 0;
      padding: 2px 10px;
      background: var(--primary-bg);
      color: var(--primary);
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .news-item .source {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    /* 今日动作
    --------------------------------------------------------- */
    .actions {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .actions h3 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--accent);
    }

    .actions ul {
      margin: 0;
      padding-left: 20px;
      color: var(--text);
    }

    .actions li { margin: 6px 0; }

    .status {
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>财经新闻 · 五大赛道 · 每日洞察</h1>
      <p>保险 / 银行 / 非银金融 / 信贷 / 财富管理：AI 每赛道给一句话洞察。</p>
      <div class="meta" id="hero-meta">数据更新中…</div>
    </header>

    <div class="status" id="status">正在抓取数据中…</div>

    <!-- 整体局面 -->
    <div class="hidden" id="overall-block">
      <div class="section-title">AI 整体局面</div>
      <div class="overall" id="overall"></div>
    </div>

    <!-- 分赛道每日洞察 -->
    <div class="hidden" id="insights-block">
      <div class="section-title">五大赛道 · 每日洞察</div>
      <div class="sector-insights" id="sector-insights"></div>
    </div>

    <!-- 今日动作 -->
    <div class="hidden" id="actions-block">
      <div class="section-title">今日可执行动作</div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <script>
    const JSON_URL = "https://katherynsun21-sketch.github.io/financial/data/latest.json";

    const SECTORS = ["保险", "银行", "非金", "信贷", "财富"];

    function renderHero(meta) {
      const el = document.getElementById("hero-meta");
      if (!el) return;
      const date = meta.date || "";
      const time = meta.time || "";
      const total = meta.total_items || 0;
      const srcCount = meta.sources_count || "-";
      el.innerHTML =
        "更新时间：" + (date + " " + time) +
        "　｜　共 <b>" + total + "</b> 条新闻" +
        "　｜　来源数量 <b>" + srcCount + "</b>";
    }

    function renderOverall(data) {
      const block = document.getElementById("overall-block");
      const el = document.getElementById("overall");
      const sit = data.situation_analysis || {};

      block.classList.remove("hidden");

      const overall = sit.overall || sit.overall_situation || "暂无 AI 局面分析。";
      const themes = Array.isArray(sit.core_themes) && sit.core_themes.length ? sit.core_themes.slice(0, 6) : [];

      el.innerHTML = "";

      const h3 = document.createElement("h3");
      h3.textContent = "今日整体局面";
      el.appendChild(h3);

      const p = document.createElement("p");
      p.textContent = overall;
      el.appendChild(p);

      if (themes.length) {
        const themesWrap = document.createElement("div");
        themesWrap.className = "themes";
        themes.forEach(function (t) {
          const span = document.createElement("span");
          span.textContent = "# " + t;
          themesWrap.appendChild(span);
        });
        el.appendChild(themesWrap);
      }
    }

    function firstTruthy(obj, keys) {
      for (let i = 0; i < keys.length; i++) {
        if (obj[keys[i]]) return obj[keys[i]];
      }
      return "";
    }

    function renderSectorInsights(data) {
      const block = document.getElementById("insights-block");
      const el = document.getElementById("sector-insights");
      const sit = data.situation_analysis || {};
      const sectorViews = sit.sector_views || sit.sectors || {};
      const summary = data.sector_summary || {};
      const bySector = data.by_sector || {};

      block.classList.remove("hidden");
      el.innerHTML = "";

      SECTORS.forEach(function (sector) {
        const view = sectorViews[sector] || {};
        const s = summary[sector] || {};
        const items = bySector[sector] || [];

        const insightText =
          firstTruthy(view, ["insight", "observation", "daily_insight"]) ||
          "今日共 " + (s.count || 0) + " 条 " + sector + " 相关新闻，持续观察。";

        const topics = s.topic_counts ? Object.keys(s.topic_counts).slice(0, 5) : [];

        const card = document.createElement("div");
        card.className = "sector-card";

        card.innerHTML =
          '<div class="head">' +
          '<h3>' + sector + '</h3>' +
          '<span class="count">' + (s.count || 0) + ' 条新闻</span>' +
          '</div>' +
          '<div class="insight">' + insightText + '</div>';

        if (topics.length) {
          const topicsEl = document.createElement("div");
          topicsEl.className = "topics";
          topics.forEach(function (t) {
            const span = document.createElement("span");
            span.textContent = t;
            topicsEl.appendChild(span);
          });
          card.appendChild(topicsEl);
        }

        if (items.length) {
          const list = document.createElement("div");
          list.className = "news-list";
          items.slice(0, 8).forEach(function (item) {
            const title = item.title || "";
            const url = item.url || "#";
            const source = item.source || "";
            const topic = firstTruthy(item, ["topic_type", "event_type"]);

            const row = document.createElement("div");
            row.className = "news-item";
            row.innerHTML =
              '<div style="flex:1;">' +
              '<a class="title" href="' + url + '" target="_blank" rel="noopener">' + title + '</a>' +
              (source ? '<div class="source">来源：' + source + '</div>' : "") +
              '</div>' +
              (topic ? '<span class="tag">' + topic + '</span>' : "");
            list.appendChild(row);
          });
          card.appendChild(list);
        }

        el.appendChild(card);
      });
    }

    function renderActions(data) {
      const block = document.getElementById("actions-block");
      const el = document.getElementById("actions");
      const sit = data.situation_analysis || {};
      const actions = Array.isArray(sit.today_actions) ? sit.today_actions : [];

      if (!actions.length) return;

      block.classList.remove("hidden");
      el.innerHTML = "";

      const h3 = document.createElement("h3");
      h3.textContent = "今日可执行动作";
      el.appendChild(h3);

      const ul = document.createElement("ul");
      actions.forEach(function (a) {
        const li = document.createElement("li");
        li.textContent = a;
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }

    fetch(JSON_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        document.getElementById("status").classList.add("hidden");
        renderHero(data);
        renderOverall(data);
        renderSectorInsights(data);
        renderActions(data);
      })
      .catch(function (err) {
        const el = document.getElementById("status");
        el.textContent = "数据加载失败：" + err.message;
        el.classList.add("error");
      });
  </script>
</body>
</html>
