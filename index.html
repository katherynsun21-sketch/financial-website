<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财经热榜 · 每日速读</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #4f9dff;
    --hot: #ff6b6b;
    --warm: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
  header { margin-bottom: 28px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 1px; }
  .subtitle { color: var(--muted); font-size: 14px; }
  .loader {
    text-align: center; padding: 60px 0; color: var(--muted); font-size: 14px;
  }
  .error {
    background: #3a1a1a; border: 1px solid #6a2a2a; color: #ffb3b3;
    padding: 16px 20px; border-radius: 10px; margin: 20px 0;
  }
  .board {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 20px; overflow: hidden;
  }
  .board-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  .board-name { font-size: 16px; font-weight: 600; }
  .board-meta { color: var(--muted); font-size: 13px; }
  .board-items { list-style: none; margin: 0; padding: 0; }
  .board-items li {
    padding: 12px 20px; display: flex; gap: 14px; align-items: flex-start;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s;
  }
  .board-items li:hover { background: rgba(255,255,255,0.02); }
  .board-items li:last-child { border-bottom: none; }
  .rank {
    font-size: 15px; font-weight: 700; color: var(--hot);
    min-width: 24px; text-align: center; flex-shrink: 0;
  }
  .board-items li:nth-child(n=4) .rank { color: var(--muted); }
  .item-content { flex: 1; }
  .item-title { font-size: 14.5px; }
  .item-title a { color: var(--text); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-heat { font-size: 12px; color: var(--warm); margin-top: 4px; }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💹 财经热榜 · 每日速读</h1>
    <div class="subtitle" id="fetchedAt">加载中…</div>
  </header>
  <div id="content">
    <div class="loader">正在拉取最新数据…</div>
  </div>
  <footer>
    数据来源：tophub.today/c/finance ·
    <a href="https://github.com/katherynsun21-sketch/financial">数据仓库</a>
  </footer>
</div>

<script>
  // ⚠️ 如果你的数据仓库名字不一样，改这里
  const DATA_URL = "https://katherynsun21-sketch.github.io/financial/data/latest.json";

  function escape(s) {
    return String(s || "").replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function render(data) {
    const content = document.getElementById('content');
    document.getElementById('fetchedAt').textContent =
      `更新于 ${data.date} ${data.time}（北京时间）· ${data.boards_count} 个榜单 · ${data.total_items} 条数据`;

    let html = '';
    for (const board of data.boards) {
      html += `
        <div class="board">
          <div class="board-header">
            <div class="board-name">${escape(board.board_name)}</div>
            <div class="board-meta">${escape(board.board_subtitle)} · ${board.items_count} 条 · ${escape(board.update_time)}</div>
          </div>
          <ul class="board-items">
            ${board.items.slice(0, 10).map(item => `
              <li>
                <span class="rank">${item.rank}</span>
                <div class="item-content">
                  <div class="item-title">
                    ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${escape(item.title)}</a>` : escape(item.title)}
                  </div>
                  ${item.heat_value ? `<div class="item-heat">🔥 ${escape(item.heat_raw || item.heat_value)}</div>` : ''}
                </div>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }
    content.innerHTML = html;
  }

  fetch(DATA_URL, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<div class="error">
           加载数据失败：${escape(err.message)}<br><br>
           可能原因：<br>
           1) 数据仓库的 GitHub Pages 还没部署好（等 1-2 分钟刷新试试）<br>
           2) 数据仓库还没跑过抓取 Actions，所以 data/latest.json 还不存在<br>
           3) 检查下面这个 URL 在浏览器里能否打开：<br>
           <code style="word-break: break-all;">${DATA_URL}</code>
         </div>`;
    });
</script>
</body>
</html>
