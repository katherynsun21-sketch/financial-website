<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财经热榜 · 五大赛道</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #22262f;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #4f9dff;
    --hot: #ff6b6b;
    --warm: #f5a623;
    --good: #4caf82;
    --bad: #ff6b6b;
    --neutral: #8a93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 32px 20px; }
  header { margin-bottom: 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 1px; }
  .subtitle { color: var(--muted); font-size: 14px; }

  /* 顶部 Tab 切换 */
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
    border-bottom: 1px solid var(--border); padding-bottom: 12px;
  }
  .tab {
    padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  }

  .loader { text-align: center; padding: 60px 0; color: var(--muted); font-size: 14px; }
  .error {
    background: #3a1a1a; border: 1px solid #6a2a2a; color: #ffb3b3;
    padding: 16px 20px; border-radius: 10px; margin: 20px 0;
  }

  /* 市场总览 */
  .overview {
    background: linear-gradient(135deg, #1e2a47, #1a1d24);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; margin-bottom: 24px;
  }
  .overview-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .overview-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-top: 14px;
  }
  .overview-item { background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 10px; }
  .overview-item .l { font-size: 12px; color: var(--muted); }
  .overview-item .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .overview-brief { font-size: 15px; margin-top: 16px; color: #d6dcea; }

  /* 五大赛道卡片 */
  .sector-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;
    margin-bottom: 28px;
  }
  .sector-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; cursor: pointer; transition: all 0.15s;
  }
  .sector-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .sector-name { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .sector-stats { display: flex; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .sector-stats .good { color: var(--good); }
  .sector-stats .bad { color: var(--bad); }
  .sector-stats .neu { color: var(--neutral); }
  .sector-top-title { font-size: 13.5px; color: var(--text); margin-top: 6px; line-height: 1.5; }

  /* 面板：榜单 / 分类 */
  .panel { display: none; }
  .panel.active { display: block; }

  /* 榜单面板 */
  .board {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 20px; overflow: hidden;
  }
  .board-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .board-name { font-size: 16px; font-weight: 600; }
  .board-meta { color: var(--muted); font-size: 13px; }
  .board-items { list-style: none; margin: 0; padding: 0; }
  .board-items li {
    padding: 12px 20px; display: flex; gap: 14px; align-items: flex-start;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .board-items li:hover { background: rgba(255,255,255,0.02); }
  .board-items li:last-child { border-bottom: none; }
  .rank { font-size: 15px; font-weight: 700; color: var(--hot); min-width: 24px; text-align: center; flex-shrink: 0; }
  .board-items li:nth-child(n=4) .rank { color: var(--muted); }
  .item-content { flex: 1; }
  .item-title { font-size: 14.5px; }
  .item-title a { color: var(--text); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-heat { font-size: 12px; color: var(--warm); margin-top: 4px; }

  /* 分类面板 - 赛道详情 */
  .sector-detail {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 20px; overflow: hidden;
  }
  .sector-detail-header {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #1a2540, #1a1d24);
  }
  .sector-detail-name { font-size: 18px; font-weight: 700; }
  .impact-row {
    padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex; gap: 14px; align-items: flex-start;
  }
  .impact-row:hover { background: rgba(255,255,255,0.02); }
  .score-pill {
    flex-shrink: 0; width: 52px; text-align: center;
    padding: 4px 0; border-radius: 8px; font-size: 13px; font-weight: 700;
  }
  .score-p2 { background: #2d5a3d; color: #a3e7bd; }
  .score-p1 { background: #1e4a2d; color: #8acfa5; }
  .score-0  { background: #3a3f4a; color: #c5cddc; }
  .score-m1 { background: #4a2424; color: #f0a8a8; }
  .score-m2 { background: #6a1d1d; color: #ff9d9d; }
  .impact-content { flex: 1; }
  .impact-title { font-size: 14.5px; }
  .impact-title a { color: var(--text); text-decoration: none; }
  .impact-title a:hover { color: var(--accent); text-decoration: underline; }
  .impact-reason { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .impact-source { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💹 财经热榜 · 五大赛道</h1>
    <div class="subtitle" id="fetchedAt">加载中…</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="sectors">📂 五大赛道</div>
    <div class="tab" data-tab="boards">📰 原始榜单</div>
  </div>

  <div id="content">
    <div class="loader">正在拉取最新数据…</div>
  </div>

  <footer>
    数据来源：tophub.today/c/finance ·
    <a href="https://github.com/katherynsun21-sketch/financial">数据仓库</a>
  </footer>
</div>

<script>
  const DATA_URL = "https://katherynsun21-sketch.github.io/financial/data/latest.json";

  function escape(s) {
    return String(s || "").replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function scorePill(score) {
    const cls = score >= 2 ? 'score-p2' : score === 1 ? 'score-p1'
              : score === 0 ? 'score-0'   : score === -1 ? 'score-m1' : 'score-m2';
    const label = score >= 2 ? '强利好' : score === 1 ? '利好'
                : score === 0 ? '中性'   : score === -1 ? '利空' : '强利空';
    return `<span class="score-pill ${cls}">${label}</span>`;
  }

  function renderSectors(data) {
    const bySector = data.by_sector || {};
    const cls = data.classification || {};
    const overview = cls.market_overview || {};

    let html = '';

    // 顶部市场总览
    html += `
      <div class="overview">
        <div class="overview-label">🤖 AI · 今日盘面</div>
        <div class="overview-brief">${escape(overview.brief || "——")}</div>
        <div class="overview-grid">
          <div class="overview-item"><div class="l">市场情绪</div><div class="v">${escape(overview.overall_sentiment)}</div></div>
          <div class="overview-item"><div class="l">热门赛道</div><div class="v">${escape(overview.hot_sector)}</div></div>
          <div class="overview-item"><div class="l">承压赛道</div><div class="v">${escape(overview.cold_sector)}</div></div>
        </div>
      </div>
    `;

    // 五大赛道快速卡片
    const sectorNames = ["保险", "银行", "非银金融", "信贷", "财富管理"];
    html += '<div class="sector-grid">';
    for (const s of sectorNames) {
      const items = bySector[s] || [];
      let goodCount = 0, badCount = 0, neuCount = 0;
      for (const it of items) {
        const sc = it.this_sector_score;
        if (sc > 0) goodCount++;
        else if (sc < 0) badCount++;
        else neuCount++;
      }
      const topTitle = items[0] ? items[0].title : "暂无命中新闻";
      html += `
        <div class="sector-card">
          <div class="sector-name">${escape(s)}</div>
          <div class="sector-stats">
            <span class="good">利好 ${goodCount}</span>
            <span class="neu">中性 ${neuCount}</span>
            <span class="bad">利空 ${badCount}</span>
          </div>
          <div class="sector-top-title">📰 ${escape(topTitle)}</div>
        </div>
      `;
    }
    html += '</div>';

    // 每大赛道下面的详细新闻列表
    for (const s of sectorNames) {
      const items = bySector[s] || [];
      html += `
        <div class="sector-detail">
          <div class="sector-detail-header">
            <div class="sector-detail-name">🏷️ ${escape(s)}</div>
            <div class="board-meta">${items.length} 条相关新闻</div>
          </div>
          ${
            items.length === 0
              ? `<div class="impact-row" style="color:var(--muted)">今日暂无该赛道相关新闻。</div>`
              : items.slice(0, 15).map(it => `
                  <div class="impact-row">
                    ${scorePill(it.this_sector_score)}
                    <div class="impact-content">
                      <div class="impact-title">
                        ${it.url ? `<a href="${escape(it.url)}" target="_blank" rel="noopener">${escape(it.title)}</a>` : escape(it.title)}
                      </div>
                      <div class="impact-reason">💬 ${escape(it.this_sector_reason)}</div>
                      <div class="impact-source">来自 ${escape(it.source_board)}</div>
                    </div>
                  </div>
                `).join('')
          }
        </div>
      `;
    }

    if (cls.error) {
      html = `<div class="error">⚠️ AI 分类暂不可用：${escape(cls.error)}<br>以下仅展示原始榜单。</div>` + html;
    }

    return html;
  }

  function renderBoards(data) {
    let html = '';
    for (const board of data.boards) {
      html += `
        <div class="board">
          <div class="board-header">
            <div class="board-name">${escape(board.board_name)}</div>
            <div class="board-meta">${escape(board.board_subtitle)} · ${board.items_count} 条 · ${escape(board.update_time)}</div>
          </div>
          <ul class="board-items">
            ${board.items.slice(0, 10).map(item => `
              <li>
                <span class="rank">${item.rank}</span>
                <div class="item-content">
                  <div class="item-title">
                    ${item.url ? `<a href="${escape(item.url)}" target="_blank" rel="noopener">${escape(item.title)}</a>` : escape(item.title)}
                  </div>
                  ${item.heat_value ? `<div class="item-heat">🔥 ${escape(item.heat_raw || item.heat_value)}</div>` : ''}
                </div>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }
    return html;
  }

  let cachedData = null;

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    if (!cachedData) return;
    const content = document.getElementById('content');
    content.innerHTML = name === 'sectors' ? renderSectors(cachedData) : renderBoards(cachedData);
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  fetch(DATA_URL, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      cachedData = data;
      document.getElementById('fetchedAt').textContent =
        `更新于 ${data.date} ${data.time}（北京时间）· ${data.boards_count} 个榜单 · ${data.total_items} 条原始数据`;
      switchTab('sectors');
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<div class="error">
           加载数据失败：${escape(err.message)}<br><br>
           可能原因：<br>
           1) 数据仓库 Pages 刚开启，等 1-2 分钟刷新；<br>
           2) 数据仓库还没跑过 Actions，data/latest.json 不存在；<br>
           3) 测试：<code style="word-break: break-all;">${DATA_URL}</code>
         </div>`;
    });
</script>
</body>
</html>
